<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speed Mental Arithmetic</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col items-center justify-center p-4">
<div class="w-full max-w-lg">
  <h1 class="text-3xl font-bold text-center mb-2 text-indigo-400">Speed Arithmetic</h1>
  <p class="text-center text-gray-400 text-sm mb-6">Answer as many as you can in 60 seconds</p>

  <div id="setup" class="bg-gray-900 rounded-2xl p-6 shadow-xl">
    <p class="text-gray-300 font-semibold mb-3">Select categories:</p>
    <div class="grid grid-cols-2 gap-3 mb-6">
      <label class="flex items-center gap-2 cursor-pointer">
        <input type="checkbox" id="cat-add" checked class="w-4 h-4 accent-indigo-500" aria-label="Addition">
        <span class="text-gray-200">Addition (+)</span>
      </label>
      <label class="flex items-center gap-2 cursor-pointer">
        <input type="checkbox" id="cat-sub" checked class="w-4 h-4 accent-indigo-500" aria-label="Subtraction">
        <span class="text-gray-200">Subtraction (−)</span>
      </label>
      <label class="flex items-center gap-2 cursor-pointer">
        <input type="checkbox" id="cat-mul" checked class="w-4 h-4 accent-indigo-500" aria-label="Multiplication">
        <span class="text-gray-200">Multiplication (×)</span>
      </label>
      <label class="flex items-center gap-2 cursor-pointer">
        <input type="checkbox" id="cat-div" class="w-4 h-4 accent-indigo-500" aria-label="Division">
        <span class="text-gray-200">Division (÷)</span>
      </label>
    </div>
    <div id="high-score-display" class="text-center text-gray-400 text-sm mb-4"></div>
    <button id="start-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-bold py-3 rounded-xl text-lg transition-colors">
      Start Game
    </button>
  </div>

  <div id="game" class="hidden bg-gray-900 rounded-2xl p-6 shadow-xl">
    <div class="flex justify-between items-center mb-4">
      <div class="text-center">
        <div class="text-xs text-gray-400 uppercase tracking-wide">Score</div>
        <div id="score" class="text-2xl font-bold text-indigo-400">0</div>
      </div>
      <div class="text-center">
        <div id="timer-display" class="text-4xl font-bold text-white tabular-nums">60</div>
        <div class="text-xs text-gray-400 uppercase tracking-wide">seconds</div>
      </div>
      <div class="text-center">
        <div class="text-xs text-gray-400 uppercase tracking-wide">Streak</div>
        <div id="streak" class="text-2xl font-bold text-yellow-400">0</div>
      </div>
    </div>

    <div id="timer-bar-bg" class="w-full bg-gray-700 rounded-full h-2 mb-6">
      <div id="timer-bar" class="bg-indigo-500 h-2 rounded-full transition-all duration-1000" style="width:100%"></div>
    </div>

    <div id="multiplier-badge" class="text-center mb-3 h-6">
      <span id="multiplier-text" class="hidden text-xs font-bold bg-yellow-500 text-black px-3 py-1 rounded-full">×1</span>
    </div>

    <div class="text-center mb-6">
      <div id="difficulty-label" class="text-xs text-gray-500 mb-1">Level 1</div>
      <div id="problem" class="text-5xl font-bold text-white tracking-wide" aria-live="polite" aria-label="Math problem"></div>
    </div>

    <div id="feedback" class="text-center text-lg font-semibold mb-3 h-7" aria-live="polite"></div>

    <div class="flex gap-3">
      <input id="answer-input" type="number" inputmode="numeric"
        class="flex-1 bg-gray-800 border-2 border-gray-600 focus:border-indigo-500 outline-none rounded-xl px-4 py-3 text-xl text-center text-white transition-colors"
        aria-label="Your answer" placeholder="?" autocomplete="off">
      <button id="check-btn" class="bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-bold px-6 rounded-xl transition-colors">
        Check
      </button>
    </div>
  </div>

  <div id="result" class="hidden bg-gray-900 rounded-2xl p-6 shadow-xl text-center">
    <div class="text-5xl mb-3">🎉</div>
    <h2 class="text-2xl font-bold text-indigo-400 mb-1">Time's Up!</h2>
    <div class="text-6xl font-bold text-white my-4" id="final-score"></div>
    <div class="text-gray-400 mb-2" id="final-breakdown"></div>
    <div id="new-high" class="text-yellow-400 font-bold text-lg mb-4 hidden">🏆 New High Score!</div>
    <div class="text-gray-400 text-sm mb-6" id="prev-high"></div>
    <button id="play-again-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl text-lg transition-colors">
      Play Again
    </button>
    <button id="change-settings-btn" class="w-full mt-3 bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 rounded-xl text-lg transition-colors">
      Change Settings
    </button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

let timer, timeLeft, score, streak, level, consecutiveCorrect, currentAnswer, currentOp, activeCats, gameRunning;

function getHighScore(cats) {
  const key = 'arith_hs_' + cats.sort().join('');
  return parseInt(localStorage.getItem(key) || '0');
}
function setHighScore(cats, s) {
  const key = 'arith_hs_' + cats.sort().join('');
  localStorage.setItem(key, s);
}

function getActiveCats() {
  const cats = [];
  if ($('cat-add').checked) cats.push('add');
  if ($('cat-sub').checked) cats.push('sub');
  if ($('cat-mul').checked) cats.push('mul');
  if ($('cat-div').checked) cats.push('div');
  return cats.length ? cats : ['add'];
}

function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

function generateProblem() {
  const op = activeCats[randInt(0, activeCats.length - 1)];
  currentOp = op;
  const scale = Math.min(level, 6);
  let a, b, ans, sym;
  if (op === 'add') {
    a = randInt(1, scale * 15);
    b = randInt(1, scale * 15);
    ans = a + b; sym = '+';
  } else if (op === 'sub') {
    a = randInt(scale * 5, scale * 20);
    b = randInt(1, a);
    ans = a - b; sym = '−';
  } else if (op === 'mul') {
    const max = Math.min(2 + scale * 2, 20);
    a = randInt(2, max);
    b = randInt(2, max);
    ans = a * b; sym = '×';
  } else {
    b = randInt(2, Math.min(2 + scale * 2, 15));
    ans = randInt(1, Math.min(1 + scale * 5, 50));
    a = b * ans;
    sym = '÷';
  }
  currentAnswer = ans;
  $('problem').textContent = `${a} ${sym} ${b} = ?`;
  $('problem').setAttribute('aria-label', `${a} ${sym} ${b} equals what`);
  $('difficulty-label').textContent = `Level ${level}`;
  $('answer-input').value = '';
  $('answer-input').focus();
}

function getMultiplier() {
  if (streak >= 10) return 4;
  if (streak >= 7) return 3;
  if (streak >= 4) return 2;
  return 1;
}

function checkAnswer() {
  if (!gameRunning) return;
  const val = parseInt($('answer-input').value);
  if (isNaN(val)) return;
  const mult = getMultiplier();
  if (val === currentAnswer) {
    consecutiveCorrect++;
    streak++;
    const pts = 10 * mult;
    score += pts;
    $('score').textContent = score;
    $('streak').textContent = streak;
    $('feedback').textContent = mult > 1 ? `+${pts} ×${mult} streak!` : '+10 ✓';
    $('feedback').className = 'text-center text-lg font-semibold mb-3 h-7 text-green-400';
    if (consecutiveCorrect >= 3) { level++; consecutiveCorrect = 0; }
  } else {
    streak = 0; consecutiveCorrect = 0;
    $('feedback').textContent = `✗ Answer was ${currentAnswer}`;
    $('feedback').className = 'text-center text-lg font-semibold mb-3 h-7 text-red-400';
    $('streak').textContent = '0';
  }
  updateMultiplierBadge();
  generateProblem();
}

function updateMultiplierBadge() {
  const m = getMultiplier();
  const el = $('multiplier-text');
  if (m > 1) { el.textContent = `×${m} STREAK`; el.classList.remove('hidden'); }
  else { el.classList.add('hidden'); }
}

function startGame() {
  activeCats = getActiveCats();
  timeLeft = 60; score = 0; streak = 0; level = 1; consecutiveCorrect = 0; gameRunning = true;
  $('score').textContent = '0';
  $('streak').textContent = '0';
  $('feedback').textContent = '';
  $('multiplier-text').classList.add('hidden');
  $('setup').classList.add('hidden');
  $('result').classList.add('hidden');
  $('game').classList.remove('hidden');
  generateProblem();
  $('timer-bar').style.width = '100%';
  clearInterval(timer);
  timer = setInterval(() => {
    timeLeft--;
    $('timer-display').textContent = timeLeft;
    $('timer-bar').style.width = (timeLeft / 60 * 100) + '%';
    if (timeLeft <= 10) $('timer-bar').classList.replace('bg-indigo-500', 'bg-red-500');
    if (timeLeft <= 0) endGame();
  }, 1000);
}

function endGame() {
  clearInterval(timer);
  gameRunning = false;
  $('game').classList.add('hidden');
  $('result').classList.remove('hidden');
  $('final-score').textContent = score;
  $('final-breakdown').textContent = `Reached Level ${level} · Best streak: ${streak}`;
  const hs = getHighScore(activeCats);
  $('prev-high').textContent = `Previous best: ${hs}`;
  if (score > hs) { setHighScore(activeCats, score); $('new-high').classList.remove('hidden'); }
  else { $('new-high').classList.add('hidden'); }
}

function showSetup() {
  $('game').classList.add('hidden');
  $('result').classList.add('hidden');
  $('setup').classList.remove('hidden');
  updateHighScoreDisplay();
}

function updateHighScoreDisplay() {
  const cats = getActiveCats();
  const hs = getHighScore(cats);
  $('high-score-display').textContent = hs > 0 ? `High Score: ${hs}` : '';
}

$('start-btn').addEventListener('click', startGame);
$('check-btn').addEventListener('click', checkAnswer);
$('play-again-btn').addEventListener('click', startGame);
$('change-settings-btn').addEventListener('click', showSetup);
$('answer-input').addEventListener('keydown', e => { if (e.key === 'Enter') checkAnswer(); });
['cat-add','cat-sub','cat-mul','cat-div'].forEach(id => {
  $(id).addEventListener('change', updateHighScoreDisplay);
});

updateHighScoreDisplay();
</script>
</body>
</html>
